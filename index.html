<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第三届评分 Tier List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <style>
    @font-face {
      font-family: "Zpix";
      src: url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/zpix.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #f7945f;
      --bg: #08080b;
      --line: #303038;
      --text: #f5f3f1;
      --muted: #989198;
      --tier-label-width: 154px;
      --tile-width: 176px;
      --tile-height: 99px;
      --tier-label-pad-y: 12px;
      --tier-label-pad-x: 8px;
      --tier-name-size: 18px;
      --tier-score-size: 14px;
      --tier-deco-size: 9px;
      --tier-deco-offset: 9px;
      --card-number-left: 5px;
      --card-number-top: 5px;
      --card-number-min-width: 27px;
      --card-number-pad-y: 2px;
      --card-number-pad-x: 5px;
      --card-number-font-size: 11px;
      --card-number-border: 4px;
      --empty-tip-pad: 20px;
      --empty-tip-font-size: 12px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        radial-gradient(circle at 12% 0%, rgba(247,148,95,.10), transparent 28%),
        radial-gradient(circle at 96% 100%, rgba(247,148,95,.06), transparent 26%),
        var(--bg);
      background-size: 24px 24px, 24px 24px, auto, auto, auto;
      font-family: "Noto Sans SC", sans-serif;
    }

    button, textarea { font: inherit; }

    .page {
      width: min(100%, 1880px);
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      position: relative;
      display: block;
      margin-bottom: 12px;
      padding: 14px 16px 15px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(16,16,21,.92);
      box-shadow: 6px 6px 0 rgba(247,148,95,.08);
    }

    .header::before {
      content: "啊 呀 喵 咚 哦";
      position: absolute;
      right: 14px;
      top: -8px;
      color: rgba(247,148,95,.045);
      font: 400 48px/1 "Zpix", monospace;
      letter-spacing: .10em;
      pointer-events: none;
      white-space: nowrap;
    }

    .title-wrap { position: relative; z-index: 1; }
    h1 {
      margin: 0;
      font: 900 clamp(22px, 3.2vw, 40px)/1.05 Montserrat, "Noto Sans SC", sans-serif;
      letter-spacing: -.02em;
    }
    .accent { color: var(--accent); }

    .header-actions {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(3px, .7vw, 9px);
      width: 100%;
      margin-top: 10px;
    }

    .header-actions .btn {
      width: 100%;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      min-height: clamp(30px, 4vw, 40px);
      padding: clamp(5px, .8vw, 9px) clamp(2px, .8vw, 12px);
      font-size: clamp(8px, 1.8vw, 12px);
    }

    .btn {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid #3a3a43;
      border-radius: 0;
      color: #dedbe0;
      background: #202027;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: transform .15s ease, border-color .15s ease;
    }
    .btn:hover { transform: translate(-1px,-1px); border-color: var(--accent); }
    .btn.primary {
      color: #17120f;
      border-color: #ffc19f;
      background: var(--accent);
      box-shadow: 4px 4px 0 rgba(247,148,95,.18);
    }
    .btn.danger { color: #ffb3ad; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 9px;
      padding: 8px 11px;
      border: 1px solid #292930;
      color: #aaa4aa;
      background: rgba(16,16,21,.82);
      font: 500 11px/1.45 "IBM Plex Mono", monospace;
    }
    .status-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .status-dot {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(247,148,95,.4);
    }
    #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { flex: 0 0 auto; color: var(--accent); font-weight: 700; }

    .tier-board {
      border: 1px solid #34343d;
      background: #0e0e13;
      box-shadow: 12px 12px 0 rgba(0,0,0,.28);
    }

    .tier-row {
      display: grid;
      grid-template-columns: var(--tier-label-width) minmax(0, 1fr);
      min-height: var(--tile-height);
      border-bottom: 1px solid #34343d;
    }
    .tier-row:last-child { border-bottom: 0; }

    .tier-label {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: var(--tile-height);
      padding: var(--tier-label-pad-y) var(--tier-label-pad-x);
      overflow: hidden;
      border-right: 1px solid #34343d;
      text-align: center;
    }
    .tier-label::before,
    .tier-label::after {
      content: "";
      position: absolute;
      width: var(--tier-deco-size);
      height: var(--tier-deco-size);
      background: rgba(255,255,255,.14);
    }
    .tier-label::before { left: var(--tier-deco-offset); top: var(--tier-deco-offset); }
    .tier-label::after { right: var(--tier-deco-offset); bottom: var(--tier-deco-offset); }
    .tier-name { font-size: var(--tier-name-size); font-weight: 900; line-height: 1.15; }
    .tier-score { margin-top: calc(var(--tier-name-size) * .28); font: 700 var(--tier-score-size)/1 "IBM Plex Mono", monospace; opacity: .72; }

    /* 关键修正：容器始终只有一层高度；空提示绝对定位，不参与高度计算。 */
    .tier-drop-wrap {
      position: relative;
      min-width: 0;
      min-height: var(--tile-height);
    }

    .tier-items {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      min-width: 0;
      min-height: var(--tile-height);
      padding: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        #111116;
      background-size: 22px 22px;
    }
    .tier-items.drag-over { background-color: rgba(247,148,95,.055); }

    .empty-tip {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: none;
      align-items: center;
      padding: 0 var(--empty-tip-pad);
      color: #57535b;
      font: 500 var(--empty-tip-font-size)/1.4 "IBM Plex Mono", monospace;
      pointer-events: none;
    }
    .tier-items:empty + .empty-tip { display: flex; }

    .work-card {
      position: relative;
      flex: 0 0 var(--tile-width);
      width: var(--tile-width);
      height: var(--tile-height);
      overflow: hidden;
      border-right: 1px solid #292930;
      border-bottom: 1px solid #292930;
      background: #08080b;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .work-card:active { cursor: grabbing; }
    .work-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .work-card::after {
      content: attr(data-number);
      position: absolute;
      left: var(--card-number-left);
      top: var(--card-number-top);
      min-width: var(--card-number-min-width);
      padding: var(--card-number-pad-y) var(--card-number-pad-x);
      color: #fff;
      background: rgba(8,8,11,.76);
      border-left: var(--card-number-border) solid var(--accent);
      font: 700 var(--card-number-font-size)/1.1 "IBM Plex Mono", monospace;
      box-shadow: 2px 2px 0 rgba(0,0,0,.28);
    }
    .work-card:hover { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }
    .sortable-ghost { opacity: .22; }
    .sortable-drag { outline: 2px solid var(--accent); box-shadow: 8px 8px 0 rgba(247,148,95,.18); }
    .sortable-chosen { filter: brightness(1.08); }

    .loading-panel {
      padding: 44px 24px;
      border: 1px solid #34343d;
      text-align: center;
      color: #a49ea5;
      background: #101015;
    }
    .loading-panel strong { display: block; margin-bottom: 8px; color: var(--accent); font: 700 17px "Zpix", monospace; }
    .error-help { margin-top: 12px; font-size: 12px; line-height: 1.7; color: #7f7980; }
    code { color: #ffc19f; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.74);
      backdrop-filter: blur(5px);
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(720px, 100%);
      border: 1px solid #45454f;
      background: #15151b;
      box-shadow: 12px 12px 0 rgba(247,148,95,.12);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid #33333c;
    }
    .modal-title { font-weight: 900; }
    .close-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #3a3a43;
      color: #c5c0c5;
      background: #222228;
      cursor: pointer;
      font-size: 20px;
    }
    .modal-body { padding: 18px; }
    .score-output {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #3a3a43;
      outline: none;
      color: #f5f3f1;
      background: #0d0d12;
      font: 600 16px/1.65 "IBM Plex Mono", monospace;
    }
    .modal-meta { margin: 9px 0 15px; color: #817b82; font-size: 11px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; }

    #exportCanvas { display: none; }

    @media (max-width: 760px) {
      .page { padding: 8px; }
      .header { padding: 10px; margin-bottom: 8px; }
      .header-actions { margin-top: 8px; }
      .status-bar { padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="title-wrap">
        <h1>THIRD <span class="accent">TIER LIST</span></h1>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="reloadImages()">重新读取</button>
        <button class="btn danger" onclick="resetAll()">全部重置</button>
        <button class="btn" onclick="openScoreExport()">导出评分</button>
        <button class="btn primary" onclick="downloadTierImage()">下载图片</button>
      </div>
    </header>

    <div class="status-bar">
      <div class="status-left"><span class="status-dot"></span><span id="statusText">正在读取 image/……</span></div>
      <span id="itemCount" class="count">0 ITEMS</span>
    </div>

    <section id="loadingPanel" class="loading-panel">
      <strong>LOADING IMAGE LIST</strong>
      正在从当前网页同级目录 <code>image/</code> 读取 JPG 图片。
    </section>

    <section id="tierBoard" class="tier-board" hidden></section>
  </main>

  <div id="scoreModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="scoreModalTitle">
      <div class="modal-head">
        <div id="scoreModalTitle" class="modal-title">评分导出</div>
        <button class="close-btn" onclick="closeScoreModal()" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <textarea id="scoreOutput" class="score-output" readonly></textarea>
        <div id="scoreMeta" class="modal-meta"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeScoreModal()">关闭</button>
          <button id="copyScoreBtn" class="btn primary" onclick="copyScore()">复制文本</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas"></canvas>

  <script>
    // GitHub Pages 项目站点必须使用相对于当前 HTML 的路径，不能使用 /image/。
    const PAGE_BASE_URL = new URL('.', document.baseURI);
    const IMAGE_BASE_URL = new URL('image/', PAGE_BASE_URL);
    const MANIFEST_URL = new URL('manifest.json', IMAGE_BASE_URL);
    const MANIFEST_PATH = MANIFEST_URL.href;

    const STORAGE_KEY = 'third_competition_tier_list_v1';
    const THEME_COLOR = '#f7945f';

    // 网页端：只有正常尺寸连这么多张都放不下时，才同比缩小整套 Tier。
    // 它不是网页固定换行数；宽度足够时，仍按实际可用宽度自然换行。
    const MIN_ITEMS_PER_ROW = 6;

    // 导出端：固定每行数量。导出尺寸和设备、浏览器窗口宽度完全无关。
    const EXPORT_ITEMS_PER_ROW = 10;

    // 正常尺寸；只有当前面板宽度不足以容纳 MIN_ITEMS_PER_ROW 张时才同比缩小。
    const BASE_TIER_SIZE = Object.freeze({
      labelWidth: 154,
      tileWidth: 176,
      tileHeight: 99,
      labelPadY: 12,
      labelPadX: 8,
      nameSize: 18,
      scoreSize: 14,
      decoSize: 9,
      decoOffset: 9,
      numberLeft: 5,
      numberTop: 5,
      numberMinWidth: 27,
      numberPadY: 2,
      numberPadX: 5,
      numberFontSize: 11,
      numberBorder: 4,
      emptyPad: 20,
      emptyFontSize: 12
    });

    const TIERS = [
      { key: '3',  name: '夯',     score: '3',  color: '#f7945f', text: '#1a100c' },
      { key: '2',  name: '顶尖',   score: '2',  color: '#efaa6f', text: '#1a100c' },
      { key: '1',  name: '人上人', score: '1',  color: '#d8b77a', text: '#19130b' },
      { key: '0',  name: 'NPC',    score: '0',  color: '#929a85', text: '#10130f' },
      { key: '-1', name: '菜',     score: '-1', color: '#78907c', text: '#0d130f' },
      { key: '-2', name: '拉',     score: '-2', color: '#687587', text: '#0b0f15' },
      { key: '-3', name: '拉完了', score: '-3', color: '#5c5a70', text: '#0c0b13' },
      { key: 'X',  name: '未评价', score: 'X',  color: '#32323b', text: '#f2eef1' }
    ];

    let items = [];
    let sortables = [];
    let imageObjectUrls = [];
    let tierResizeFrame = 0;
    let tierResizeObserver = null;

    window.addEventListener('load', async () => {
      if (document.fonts?.ready) await document.fonts.ready;
      await initialize();
      installResponsiveTierSizing();
    });

    async function initialize() {
      setStatus('正在读取当前网页同级目录 image/……');
      showLoading('LOADING IMAGE LIST', '正在读取 JPG 图片。');
      try {
        const files = await discoverImageFiles();
        if (!files.length) throw new Error('没有找到符合“数字 编号.jpg”格式的图片。');
        items = files.map(file => ({
          file,
          number: extractNumber(file),
          src: new URL(encodePath(file), IMAGE_BASE_URL).href
        })).sort(compareItems);

        buildTierBoard();
        restoreState();
        sortAllTierLists();
        initializeSortables();
        updateUI();

        document.getElementById('loadingPanel').hidden = true;
        document.getElementById('tierBoard').hidden = false;
        scheduleTierSizing();
        setStatus(`已读取 ${items.length} 张 JPG；跨 Tier 拖放后会自动按数字排序。`);
      } catch (error) {
        console.error(error);
        showLoading(
          'IMAGE LIST NOT FOUND',
          `${escapeHtml(error.message)}<div class="error-help">当前页面基准地址：<code>${escapeHtml(PAGE_BASE_URL.href)}</code><br>manifest 请求地址：<code>${escapeHtml(MANIFEST_PATH)}</code><br>manifest 中的文件名必须是类似 <code>01 哦.jpg</code> 的 JPG 文件。</div>`
        );
        setStatus('读取失败，请检查 manifest 实际请求地址和 JPG 文件名。');
      }
    }

    function installResponsiveTierSizing() {
      window.addEventListener('resize', scheduleTierSizing, { passive: true });
      if ('ResizeObserver' in window) {
        tierResizeObserver?.disconnect();
        tierResizeObserver = new ResizeObserver(scheduleTierSizing);
        const page = document.querySelector('.page');
        if (page) tierResizeObserver.observe(page);
      }
      scheduleTierSizing();
    }

    function scheduleTierSizing() {
      cancelAnimationFrame(tierResizeFrame);
      tierResizeFrame = requestAnimationFrame(updateResponsiveTierSizing);
    }

    function updateResponsiveTierSizing() {
      const board = document.getElementById('tierBoard');
      if (!board || board.hidden || board.clientWidth <= 0) return;

      // 留出 1px 安全量，避免小数取整让最后一张意外换行。
      const availableWidth = Math.max(1, board.clientWidth - 1);
      // 仅判断“正常尺寸是否至少能排下 MIN_ITEMS_PER_ROW 张”。
      // 能排下：scale = 1，图片保持原尺寸并按实际宽度自然换行。
      // 排不下：才缩小到刚好能排下 MIN_ITEMS_PER_ROW 张。
      const minimumNaturalWidth = BASE_TIER_SIZE.labelWidth + MIN_ITEMS_PER_ROW * BASE_TIER_SIZE.tileWidth;
      const scale = availableWidth >= minimumNaturalWidth
        ? 1
        : availableWidth / minimumNaturalWidth;
      const root = document.documentElement.style;
      const px = value => `${Math.max(0.5, value * scale).toFixed(3)}px`;

      root.setProperty('--tier-label-width', px(BASE_TIER_SIZE.labelWidth));
      root.setProperty('--tile-width', px(BASE_TIER_SIZE.tileWidth));
      root.setProperty('--tile-height', px(BASE_TIER_SIZE.tileHeight));
      root.setProperty('--tier-label-pad-y', px(BASE_TIER_SIZE.labelPadY));
      root.setProperty('--tier-label-pad-x', px(BASE_TIER_SIZE.labelPadX));
      root.setProperty('--tier-name-size', px(BASE_TIER_SIZE.nameSize));
      root.setProperty('--tier-score-size', px(BASE_TIER_SIZE.scoreSize));
      root.setProperty('--tier-deco-size', px(BASE_TIER_SIZE.decoSize));
      root.setProperty('--tier-deco-offset', px(BASE_TIER_SIZE.decoOffset));
      root.setProperty('--card-number-left', px(BASE_TIER_SIZE.numberLeft));
      root.setProperty('--card-number-top', px(BASE_TIER_SIZE.numberTop));
      root.setProperty('--card-number-min-width', px(BASE_TIER_SIZE.numberMinWidth));
      root.setProperty('--card-number-pad-y', px(BASE_TIER_SIZE.numberPadY));
      root.setProperty('--card-number-pad-x', px(BASE_TIER_SIZE.numberPadX));
      root.setProperty('--card-number-font-size', px(BASE_TIER_SIZE.numberFontSize));
      root.setProperty('--card-number-border', px(BASE_TIER_SIZE.numberBorder));
      root.setProperty('--empty-tip-pad', px(BASE_TIER_SIZE.emptyPad));
      root.setProperty('--empty-tip-font-size', px(BASE_TIER_SIZE.emptyFontSize));

      board.dataset.tierScale = scale.toFixed(4);
    }

    async function reloadImages() {
      destroySortables();
      document.getElementById('tierBoard').hidden = true;
      await initialize();
    }

    async function discoverImageFiles() {
      const manifestResult = await tryManifest();
      if (manifestResult.found) {
        const files = normalizeDiscoveredFiles(manifestResult.files);
        if (!files.length) {
          throw new Error(`已读取 manifest，但其中没有符合“数字 编号.jpg”格式的文件。`);
        }
        return files;
      }

      const response = await fetch(IMAGE_BASE_URL.href, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`manifest 不存在（HTTP 404），且无法读取目录 ${IMAGE_BASE_URL.href}（HTTP ${response.status}）。`);
      }
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const names = [...doc.querySelectorAll('a[href]')].map(link => {
        try {
          const url = new URL(link.getAttribute('href'), IMAGE_BASE_URL);
          return decodeURIComponent(url.pathname.split('/').filter(Boolean).pop() || '');
        } catch (_) {
          return '';
        }
      });
      return normalizeDiscoveredFiles(names);
    }

    async function tryManifest() {
      let response;
      try {
        response = await fetch(MANIFEST_PATH, { cache: 'no-store' });
      } catch (error) {
        throw new Error(`请求 manifest 失败：${error.message}`);
      }

      if (response.status === 404) return { found: false, files: [] };
      if (!response.ok) throw new Error(`无法读取 manifest（HTTP ${response.status}）。`);

      let data;
      try {
        data = await response.json();
      } catch (error) {
        throw new Error(`manifest 不是有效 JSON：${error.message}`);
      }

      if (Array.isArray(data)) return { found: true, files: data };
      if (data && Array.isArray(data.files)) return { found: true, files: data.files };
      throw new Error('manifest 格式不正确：应为字符串数组，或包含 files 数组。');
    }

    function normalizeDiscoveredFiles(files) {
      const seen = new Set();
      return files
        .map(value => typeof value === 'string' ? value.trim() : '')
        .filter(Boolean)
        .filter(name => /^\d+\s+.+\.jpg$/i.test(name))
        .filter(name => {
          const key = name.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((a,b) => extractNumber(a) - extractNumber(b) || a.localeCompare(b, 'zh-CN', { numeric: true }));
    }

    function extractNumber(file) {
      const match = String(file).match(/^\s*(\d+)/);
      return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
    }

    function compareItems(a,b) {
      return a.number - b.number || a.file.localeCompare(b.file, 'zh-CN', { numeric: true });
    }

    function encodePath(path) {
      return String(path).split('/').map(encodeURIComponent).join('/');
    }

    function buildTierBoard() {
      const board = document.getElementById('tierBoard');
      board.innerHTML = '';

      TIERS.forEach(tier => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.dataset.tier = tier.key;

        const label = document.createElement('div');
        label.className = 'tier-label';
        label.style.background = tier.color;
        label.style.color = tier.text;
        label.innerHTML = `<div class="tier-name">${tier.name}</div><div class="tier-score">(${tier.score})</div>`;

        const dropWrap = document.createElement('div');
        dropWrap.className = 'tier-drop-wrap';

        const list = document.createElement('div');
        list.className = 'tier-items';
        list.dataset.tier = tier.key;
        list.setAttribute('aria-label', `${tier.name} Tier`);

        const empty = document.createElement('div');
        empty.className = 'empty-tip';
        empty.textContent = tier.key === 'X' ? '作品载入后会首先出现在这里' : '拖拽作品到这里';

        dropWrap.append(list, empty);
        row.append(label, dropWrap);
        board.appendChild(row);
      });
      scheduleTierSizing();
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'work-card';
      card.dataset.file = item.file;
      card.dataset.number = String(item.number).padStart(2, '0');
      card.title = item.file;

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.file;
      img.loading = 'eager';
      img.draggable = false;
      img.onerror = () => {
        card.style.background = '#21181a';
        card.title = `图片加载失败：${item.file}`;
      };
      card.appendChild(img);
      return card;
    }

    function restoreState() {
      const saved = loadState();
      const validFiles = new Set(items.map(item => item.file));
      const placed = new Set();

      if (saved?.tiers) {
        TIERS.forEach(tier => {
          const list = getTierList(tier.key);
          const files = Array.isArray(saved.tiers[tier.key]) ? saved.tiers[tier.key] : [];
          files.forEach(savedFile => {
            // 兼容旧版 PNG 保存结果：同名文件改成 JPG 后自动迁移。
            let file = savedFile;
            if (!validFiles.has(file)) {
              const jpgCandidate = String(savedFile).replace(/\.(png|jpeg)$/i, '.jpg');
              const matched = items.find(entry => entry.file.toLowerCase() === jpgCandidate.toLowerCase());
              if (matched) file = matched.file;
            }
            if (!validFiles.has(file) || placed.has(file)) return;
            const item = items.find(entry => entry.file === file);
            if (item) {
              list.appendChild(createCard(item));
              placed.add(file);
            }
          });
        });
      }

      const unranked = getTierList('X');
      items.filter(item => !placed.has(item.file)).forEach(item => unranked.appendChild(createCard(item)));
    }

    function initializeSortables() {
      destroySortables();

      document.querySelectorAll('.tier-items').forEach(list => {
        const sortable = new Sortable(list, {
          group: 'tier-list',
          sort: false, // 禁止同一 Tier 内手动排序
          animation: 155,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          dragClass: 'sortable-drag',
          fallbackOnBody: true,
          swapThreshold: .62,
          onMove: event => {
            // 同一个 Tier 内拖动不改变位置；只允许跨 Tier。
            if (event.from === event.to) return false;
            return true;
          },
          onAdd: event => {
            sortTierList(event.to);
          },
          onEnd: () => {
            document.querySelectorAll('.tier-items').forEach(el => el.classList.remove('drag-over'));
            sortAllTierLists();
            saveState();
            updateUI();
          }
        });
        sortables.push(sortable);
      });
    }

    function destroySortables() {
      sortables.forEach(sortable => sortable.destroy());
      sortables = [];
    }

    function sortTierList(list) {
      const cards = [...list.querySelectorAll('.work-card')];
      cards.sort((a,b) => {
        const na = Number(a.dataset.number);
        const nb = Number(b.dataset.number);
        return na - nb || a.dataset.file.localeCompare(b.dataset.file, 'zh-CN', { numeric: true });
      });
      cards.forEach(card => list.appendChild(card));
    }

    function sortAllTierLists() {
      document.querySelectorAll('.tier-items').forEach(sortTierList);
    }

    function getTierList(key) {
      return document.querySelector(`.tier-items[data-tier="${cssEscape(key)}"]`);
    }

    function cssEscape(value) {
      return String(value).replace(/(["\\])/g, '\\$1');
    }

    function collectState() {
      sortAllTierLists();
      const tiers = {};
      TIERS.forEach(tier => {
        tiers[tier.key] = [...getTierList(tier.key).querySelectorAll('.work-card')].map(card => card.dataset.file);
      });
      return { version: 2, tiers, updatedAt: new Date().toISOString() };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
      } catch (error) {
        console.warn('localStorage 保存失败：', error);
        setStatus('排序已更新，但浏览器拒绝保存 localStorage。');
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    function resetAll() {
      if (!confirm('确认把所有作品移回“未评价（X）”并清除已保存结果吗？')) return;
      const unranked = getTierList('X');
      items.slice().sort(compareItems).forEach(item => {
        const card = [...document.querySelectorAll('.work-card')].find(el => el.dataset.file === item.file);
        if (card) unranked.appendChild(card);
      });
      sortAllTierLists();
      localStorage.removeItem(STORAGE_KEY);
      saveState();
      updateUI();
      setStatus('已重置，所有作品均回到未评价（X）。');
    }

    function updateUI() {
      const total = document.querySelectorAll('.work-card').length;
      const ranked = total - getTierList('X').querySelectorAll('.work-card').length;
      document.getElementById('itemCount').textContent = `${ranked}/${total} RANKED`;
    }

    function generateScoreText() {
      const scoreByFile = new Map();
      TIERS.forEach(tier => {
        getTierList(tier.key).querySelectorAll('.work-card').forEach(card => scoreByFile.set(card.dataset.file, tier.score));
      });
      return items.slice().sort(compareItems).map(item => scoreByFile.get(item.file) ?? 'X').join(' ');
    }

    function openScoreExport() {
      const text = generateScoreText();
      const output = document.getElementById('scoreOutput');
      output.value = text;
      document.getElementById('scoreMeta').textContent = `共 ${items.length} 项，已按文件名前的数字序号排序。`;
      document.getElementById('copyScoreBtn').textContent = '复制文本';
      document.getElementById('scoreModal').classList.add('show');
      setTimeout(() => { output.focus(); output.select(); }, 40);
    }

    function closeScoreModal() {
      document.getElementById('scoreModal').classList.remove('show');
    }

    function closeModalOnBackdrop(event) {
      if (event.target.id === 'scoreModal') closeScoreModal();
    }

    async function copyScore() {
      const output = document.getElementById('scoreOutput');
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (_) {
        output.focus();
        output.select();
        document.execCommand('copy');
      }
      const button = document.getElementById('copyScoreBtn');
      button.textContent = '已复制';
      setTimeout(() => button.textContent = '复制文本', 1300);
    }

    async function downloadTierImage() {
      if (!items.length) return;
      sortAllTierLists();
      setStatus('正在生成固定尺寸 Tier 图片……');

      const exportData = TIERS.map(tier => ({
        ...tier,
        files: [...getTierList(tier.key).querySelectorAll('.work-card')].map(card => card.dataset.file)
      }));

      const TILE_W = 192;
      const TILE_H = 108;
      const LABEL_W = 260;
      const OUTER = 40;
      const TOP = 116;
      const ITEMS_PER_LINE = EXPORT_ITEMS_PER_ROW;
      const ROW_GAP = 4;
      const TIER_GAP = 4;
      const canvas = document.getElementById('exportCanvas');
      const exportCtx = canvas.getContext('2d');
      const tierHeights = exportData.map(tier => {
        const lines = Math.max(1, Math.ceil(tier.files.length / ITEMS_PER_LINE));
        return lines * TILE_H + (lines - 1) * ROW_GAP;
      });
      const width = OUTER * 2 + LABEL_W + ITEMS_PER_LINE * TILE_W;
      const height = TOP + OUTER + tierHeights.reduce((sum,h) => sum+h,0) + TIER_GAP * (TIERS.length-1);
      canvas.width = width;
      canvas.height = height;

      exportCtx.fillStyle = '#08080b';
      exportCtx.fillRect(0,0,width,height);
      drawExportGrid(exportCtx,width,height,24);
      exportCtx.fillStyle = '#f6f3f1';
      exportCtx.font = '900 42px Montserrat, sans-serif';
      exportCtx.fillText('THIRD TIER LIST',OUTER,58);
      exportCtx.fillStyle = THEME_COLOR;
      exportCtx.fillRect(OUTER,76,320,6);
      exportCtx.fillStyle = 'rgba(255,255,255,.42)';
      exportCtx.font = '600 15px "IBM Plex Mono", monospace';
      exportCtx.fillText(`${items.length} ITEMS · ${new Date().toLocaleString('zh-CN')}`,OUTER,103);

      const imageCache = await preloadExportImages(items);
      let y = TOP;

      exportData.forEach((tier,tierIndex) => {
        const tierH = tierHeights[tierIndex];
        const labelX = OUTER;
        const itemsX = OUTER + LABEL_W;

        exportCtx.fillStyle = tier.color;
        exportCtx.fillRect(labelX,y,LABEL_W,tierH);
        exportCtx.fillStyle = tier.text;
        exportCtx.textAlign = 'center';
        exportCtx.textBaseline = 'middle';
        exportCtx.font = '900 29px "Noto Sans SC", sans-serif';
        exportCtx.fillText(tier.name,labelX+LABEL_W/2,y+tierH/2-15);
        exportCtx.font = '700 20px "IBM Plex Mono", monospace';
        exportCtx.globalAlpha = .72;
        exportCtx.fillText(`(${tier.score})`,labelX+LABEL_W/2,y+tierH/2+23);
        exportCtx.globalAlpha = 1;
        exportCtx.textAlign = 'left';
        exportCtx.textBaseline = 'alphabetic';

        exportCtx.fillStyle = '#111116';
        exportCtx.fillRect(itemsX,y,ITEMS_PER_LINE*TILE_W,tierH);

        tier.files.forEach((file,index) => {
          const col = index % ITEMS_PER_LINE;
          const row = Math.floor(index / ITEMS_PER_LINE);
          const dx = itemsX + col*TILE_W;
          const dy = y + row*(TILE_H+ROW_GAP);
          const img = imageCache.get(file);
          if (img) exportCtx.drawImage(img,dx,dy,TILE_W,TILE_H);
          else {
            exportCtx.fillStyle = '#24191a';
            exportCtx.fillRect(dx,dy,TILE_W,TILE_H);
          }
          exportCtx.strokeStyle = 'rgba(255,255,255,.08)';
          exportCtx.lineWidth = 1;
          exportCtx.strokeRect(dx+.5,dy+.5,TILE_W-1,TILE_H-1);
          exportCtx.fillStyle = 'rgba(8,8,11,.78)';
          exportCtx.fillRect(dx+5,dy+5,34,21);
          exportCtx.fillStyle = THEME_COLOR;
          exportCtx.fillRect(dx+5,dy+5,4,21);
          exportCtx.fillStyle = '#fff';
          exportCtx.font = '700 12px "IBM Plex Mono", monospace';
          exportCtx.fillText(String(extractNumber(file)).padStart(2,'0'),dx+13,dy+20);
        });

        exportCtx.strokeStyle = '#34343d';
        exportCtx.lineWidth = 2;
        exportCtx.strokeRect(labelX+.5,y+.5,LABEL_W+ITEMS_PER_LINE*TILE_W-1,tierH-1);
        y += tierH + TIER_GAP;
      });

      const blob = await new Promise((resolve,reject) => canvas.toBlob(value => value ? resolve(value) : reject(new Error('导出失败')), 'image/png'));
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'third_competition_tier_list.png';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url),1500);
      setStatus(`Tier 图片已生成：固定每行 ${ITEMS_PER_LINE} 张，导出尺寸不受设备宽度影响。`);
    }

    function drawExportGrid(ctx,width,height,spacing) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.016)';
      ctx.lineWidth = 1;
      for(let x=0;x<width;x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke();}
      for(let y=0;y<height;y+=spacing){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}
      ctx.restore();
    }

    async function preloadExportImages(sourceItems) {
      imageObjectUrls.forEach(url => URL.revokeObjectURL(url));
      imageObjectUrls = [];
      const map = new Map();

      await Promise.all(sourceItems.map(async item => {
        try {
          const response = await fetch(item.src, { cache: 'force-cache' });
          if (!response.ok) return;
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          imageObjectUrls.push(url);
          const image = await new Promise((resolve,reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = url;
          });
          map.set(item.file,image);
        } catch (error) {
          console.warn(`导出时无法加载 ${item.file}`,error);
        }
      }));
      return map;
    }

    function showLoading(title,html) {
      const panel = document.getElementById('loadingPanel');
      panel.hidden = false;
      panel.innerHTML = `<strong>${title}</strong>${html}`;
    }

    function setStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
  </script>
